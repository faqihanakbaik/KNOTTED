# Nixpacks configuration for Railway deployment
# KNOTTED - Laravel 12 with PHP 8.4

[phases.setup]
nixPkgs = ["php84", "php84Extensions.mbstring", "php84Extensions.pdo", "php84Extensions.pdo_pgsql", "php84Extensions.bcmath", "php84Extensions.gd", "php84Extensions.zip", "php84Extensions.xml", "php84Extensions.curl", "php84Extensions.tokenizer", "php84Extensions.fileinfo", "php84Extensions.dom", "php84Extensions.simplexml"]

[phases.install]
cmds = [
    "composer install --optimize-autoloader --no-dev --no-interaction --prefer-dist"
]

[phases.build]
cmds = [
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"

[variables]
APP_ENV = "production"
